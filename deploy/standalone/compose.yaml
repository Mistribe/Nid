# Nid, standalone: one file and one .env, nothing to run first. Take the pieces you need.
#
#   nid                 always: the application (the API and the web app, one image)
#   postgres            --profile postgres    skip it when a Postgres (16 or later) already runs elsewhere
#   pocket-id           --profile pocket-id   skip it when your Pocket ID already runs elsewhere
#
#   cp .env.example .env                                              # then fill it in
#   docker compose up -d                                              # nid only (Postgres and Pocket ID elsewhere)
#   docker compose --profile postgres --profile pocket-id up -d       # everything, in this file
#
# No port is published but nid's (and Pocket ID's, when it runs here): TLS is your reverse proxy's. It must set
# X-Forwarded-Proto, -Host and -For itself. Details and the reference setup with backups: ../README.md.
name: nid

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  nid:
    <<: *hardened
    image: ${NID_IMAGE:-ghcr.io/mistribe/nid:latest}
    environment:
      Auth__PublicUrl: ${NID_URL:?set NID_URL in .env (https://nid.example.org)}
      Auth__Authority: ${AUTH_URL:?set AUTH_URL in .env (https://auth.example.org)}
      Auth__ClientId: ${NID_OIDC_CLIENT_ID:-nid}
      Auth__ClientSecret: ${NID_OIDC_CLIENT_SECRET:?set NID_OIDC_CLIENT_SECRET in .env (the client of Nid in Pocket ID)}
      Auth__CsrfKey: ${NID_CSRF_KEY:?set NID_CSRF_KEY in .env (openssl rand -hex 32)}
      # Forwarded headers are trusted from the private ranges, where your reverse proxy is. To trust only its address,
      # set Auth__TrustedNetworks__0 (README).
      FileLogs__Path: /var/lib/nid/logs
      FileLogs__MaxFileSizeMb: ${NID_LOG_MAX_FILE_MB:-50}
      FileLogs__RetainedFiles: ${NID_LOG_KEEP_FILES:-30}
      FileLogs__RetainedDays: ${NID_LOG_KEEP_DAYS:-14}
      ConnectionStrings__nid: Host=${NID_DB_HOST:-postgres};Port=${NID_DB_PORT:-5432};Database=${NID_DB_NAME:-nid};Username=${NID_DB_USER:-nid};Password=${NID_DB_PASSWORD:?set NID_DB_PASSWORD in .env}
    volumes:
      - dataprotection-keys:/var/lib/nid/keys
      - assets:/var/lib/nid/assets
      - documents:/var/lib/nid/documents
      - logs:/var/lib/nid/logs
    ports: ["${NID_WEB_BIND:-127.0.0.1}:${NID_WEB_PORT:-8080}:8080"]
    tmpfs: [/tmp]
    # egress: catalog, rates, icons, Pocket ID's public URL, and a Postgres that runs elsewhere; a normal network, so the
    # port above can be published. data: the one of this file.
    networks: [egress, data]
    # Waits for the Postgres of this file when it runs (--profile postgres), for nothing otherwise.
    depends_on: { postgres: { condition: service_healthy, required: false } }
    deploy: { resources: { limits: { cpus: "2.0", memory: 1g } } }

  postgres:
    profiles: [postgres]
    <<: *hardened
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # The image's own postgres user: a fresh volume is already its own, so no capability is needed to change owners.
    user: "70:70"
    environment:
      POSTGRES_DB: ${NID_DB_NAME:-nid}
      POSTGRES_USER: ${NID_DB_USER:-nid}
      POSTGRES_PASSWORD: ${NID_DB_PASSWORD:?set NID_DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    tmpfs: ["/tmp", "/var/run/postgresql:uid=70,gid=70"]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "1.0", memory: 1g } } }

  # Pocket ID's distroless image runs as 65532, and a named volume starts out root's: this one-shot owns it first.
  pocket-id-volume:
    profiles: [pocket-id]
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: [chown, "65532:65532", /app/data]
    volumes: [pocket-id:/app/data]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    restart: "no"

  # Who may sign in: its groups nid-users (may use Nid) and nid-admins (administers it). Set it up once, see ../README.md §2.
  pocket-id:
    profiles: [pocket-id]
    <<: *hardened
    image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless@sha256:138d106737498f6c20d0bec854b872bc77ec520d7a9b54502444a260a49c41cb
    user: "65532:65532"
    environment:
      APP_URL: ${AUTH_URL:?set AUTH_URL in .env (https://auth.example.org)}
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:?set POCKET_ID_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      TRUST_PROXY: "true"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      GOMEMLIMIT: 192MiB
    ports: ["${POCKET_ID_BIND:-127.0.0.1}:${POCKET_ID_PORT:-1411}:1411"]
    volumes: [pocket-id:/app/data]
    tmpfs: [/tmp]
    networks: [published]
    healthcheck:
      test: [CMD, /app/pocket-id, healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 30s
    depends_on: { pocket-id-volume: { condition: service_completed_successfully } }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

networks:
  # nid <-> the Postgres of this file; no way out.
  data: { internal: true }
  # Pocket ID's: a normal network, as a port cannot be published from an internal one.
  published: {}
  egress: {}

volumes:
  dataprotection-keys: {}
  assets: {}
  documents: {}
  logs: {}
  pgdata: {}
  pocket-id: {}
