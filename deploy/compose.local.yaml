# Local trial and CI smoke (1F1 design §5): a TLS proxy with local certificates in front of the two targets.
# docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d --build
services:
  proxy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    volumes: [./local/Caddyfile:/etc/caddy/Caddyfile:ro]
    ports: ["443:443"]
    networks:
      edge:
        # nid-api reaches Pocket ID at its public URL: inside the stack, that name must lead to this proxy.
        aliases: [nid.localtest.me, auth.localtest.me]
      # edge is internal: publishing 443 needs a normal network, as the hoster's proxy has its own.
      outside: {}

  # A throwaway API key: the smoke and the end-to-end journeys create users, groups and the Nid client through the API,
  # and sign in with one-time access tokens (docs/spikes.md section 9septies). Never on a real deployment.
  pocket-id:
    environment:
      STATIC_API_KEY: nid-local-smoke-api-key-0123456789abcdef

  nid-api:
    networks: [app, data, egress, edge]
    environment:
      # The proxy's certificate comes from its own local authority; only this overlay accepts it.
      Auth__TrustAnyIdentityProviderCertificate: "true"
      # A count requests a notification refresh at most every 5 s here (900 s by default), so the end-to-end journeys see their data evaluated.
      Notifications__RefreshThrottleSeconds: "5"

networks:
  outside: {}
