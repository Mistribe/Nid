# Local trial and CI smoke (1F1 design §5): a TLS proxy with local certificates in front of the two targets.
# docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d --build
services:
  proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    volumes: [./local/Caddyfile:/etc/caddy/Caddyfile:ro]
    ports: ["443:443"]
    networks:
      edge:
        # nid reaches Pocket ID at its public URL: inside the stack, that name must lead to this proxy.
        aliases: [nid.localtest.me, auth.localtest.me]
      # edge is internal: publishing 443 needs a normal network, as the hoster's proxy has its own.
      outside: {}

  # A throwaway API key: the smoke and the end-to-end journeys create users, groups and the Nid client through the API,
  # and sign in with one-time access tokens (docs/spikes.md section 9septies). Never on a real deployment.
  pocket-id:
    environment:
      STATIC_API_KEY: nid-local-smoke-api-key-0123456789abcdef

  # The mail catcher: nid sends its notification emails here and the journeys read them from its API (8025). Never on a real
  # deployment. `edge` is internal, so `outside` carries the published port.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ["127.0.0.1:8025:8025"]
    networks: [edge, outside]

  nid:
    environment:
      # The proxy's certificate comes from its own local authority; only this overlay accepts it.
      Auth__TrustAnyIdentityProviderCertificate: "true"
      # A count requests a notification refresh at most every 5 s here (900 s by default), so the end-to-end journeys see their data evaluated.
      Notifications__RefreshThrottleSeconds: "5"
      Nid__Smtp__Host: mailpit
      Nid__Smtp__Port: "1025"
      Nid__Smtp__From: nid@localtest.me
      Nid__Smtp__Security: None

  # #528: a scripted engine for the Compose worker (local/fake-engine.mjs), so the « Assistant » journey runs end to end
  # without a model. Never on a real deployment: there, the worker's engine is the household's Ollama or llama.cpp.
  engine:
    profiles: [worker]
    image: node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    command: [node, /engine/fake-engine.mjs]
    read_only: true
    user: node
    volumes: [./local/fake-engine.mjs:/engine/fake-engine.mjs:ro]
    networks: [models]

  worker:
    environment:
      Engine__Url: http://engine:11434
      Engine__Models: nid-test-model
      Engine__DecideModels: nid-test-decide # #450: the suggestions' guesses, never a chat model here

networks:
  outside: {}
