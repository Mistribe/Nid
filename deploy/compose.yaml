# Nid reference compose (architecture.md §10.1, 1F1 design §3). Run deploy/setup.sh first.
# The hoster's proxy reaches two targets on the `edge` network: nid:8080 (NID_HOST) and pocket-id:1411 (AUTH_HOST).
name: nid

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  postgres:
    <<: *hardened
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # The image's own postgres user: its data folder is already owned by it, so a fresh volume is too, and the entrypoint
    # needs no capability to change owners.
    user: "70:70"
    environment:
      POSTGRES_DB: nid
      POSTGRES_USER: nid
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    tmpfs: ["/tmp", "/var/run/postgresql:uid=70,gid=70"]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nid -d nid]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "1.0", memory: 1g } } }

  # Pocket ID's distroless image runs as 65532, and a named volume starts out root's: this one-shot owns it first.
  pocket-id-volume:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: [chown, "65532:65532", /app/data]
    volumes: [pocket-id:/app/data]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    restart: "no"

  # The identity provider (identity-and-access/authentication.md): who may sign in, and through the groups nid-users and
  # nid-admins who may use Nid and who administers it. SQLite and uploads on the pocket-id volume. It needs no way out:
  # analytics and the version check are off.
  pocket-id:
    <<: *hardened
    image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless@sha256:138d106737498f6c20d0bec854b872bc77ec520d7a9b54502444a260a49c41cb
    user: "65532:65532"
    environment:
      APP_URL: https://${AUTH_HOST:?run deploy/setup.sh first}
      ENCRYPTION_KEY_FILE: /run/secrets/pocket_id_encryption_key
      # The hoster's proxy is the only thing on `edge` besides nid: trust what it forwards.
      TRUST_PROXY: "true"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      GOMEMLIMIT: 192MiB
    secrets: [pocket_id_encryption_key]
    volumes: [pocket-id:/app/data]
    tmpfs: [/tmp]
    networks: [edge]
    healthcheck:
      test: [CMD, /app/pocket-id, healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 30s
    depends_on: { pocket-id-volume: { condition: service_completed_successfully } }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

  # The application: the API and the web app in one image, on one port. The hoster's proxy reaches it on `edge`, at nid:8080.
  # The alias nid-web keeps a proxy configured for the old image working through an upgrade; drop it once the proxy
  # points at nid (README, « Mise à jour »).
  nid:
    <<: *hardened
    build: { context: .., dockerfile: src/Nid.Host/Dockerfile }
    image: ${NID_IMAGE:-nid:local}
    environment:
      Auth__PublicUrl: https://${NID_HOST:?run deploy/setup.sh first}
      Auth__Authority: https://${AUTH_HOST:?run deploy/setup.sh first}
      Auth__ClientId: ${NID_OIDC_CLIENT_ID:-nid}
      # Forwarded headers are trusted from the private ranges, where the hoster's proxy is. To trust only its address:
      # Auth__TrustedNetworks__0 (README).
      # The backup's status.json, for the health notification: same age rule as the backup's own healthcheck.
      Nid__Backup__StatusPath: /run/backup-state/status.json
      Nid__Backup__MaxAgeHours: ${NID_BACKUP_MAX_AGE:-26}
    secrets:
      - { source: nid_connection_string, target: ConnectionStrings__nid }
      - { source: oidc_client_secret, target: Auth__ClientSecret }
      - { source: csrf_key, target: Auth__CsrfKey }
    volumes:
      - dataprotection-keys:/var/lib/nid/keys
      - assets:/var/lib/nid/assets
      - documents:/var/lib/nid/documents
      - backup-state:/run/backup-state:ro
    tmpfs: [/tmp]
    # The only service with a way out (egress): catalog, rates, icons, Enable Banking, and the identity provider's public URL.
    networks:
      edge: { aliases: [nid-web] }
      data: {}
      egress: {}
    depends_on: { postgres: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "2.0", memory: 1g } } }

  # Nightly restic backup (1F2 design §3). Root with three capabilities: it reads files of four owners (keys, assets and documents
  # 1654, Pocket ID 65532, deploy/secrets/ the host user), all mounted read-only; it writes the local repository, a folder
  # of the host user, and hands what it wrote back to that user. Every other mount is read-only, the root file system
  # too, so DAC_OVERRIDE and CHOWN reach only /repo and /tmp. No way out without compose.backup-remote.yaml.
  backup:
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, DAC_OVERRIDE, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true
    build: { context: ./backup }
    image: ${NID_BACKUP_IMAGE:-nid-backup:local}
    environment:
      # Empty means the entry point's default (1F2 design §3).
      NID_BACKUP_AT: ${NID_BACKUP_AT:-}
      NID_BACKUP_KEEP: ${NID_BACKUP_KEEP:-}
      NID_BACKUP_MAX_AGE: ${NID_BACKUP_MAX_AGE:-}
      NID_BACKUP_STATE_DIR: /state
      NID_BACKUP_REMOTE_FORGET: ${NID_BACKUP_REMOTE_FORGET:-}
      # embedded (default) or external: README §11. NID_DB_HOST is the Postgres server the backup reads.
      NID_BACKUP_POCKET_ID: ${NID_BACKUP_POCKET_ID:-}
      NID_DB_HOST: ${NID_DB_HOST:-}
      TZ: ${TZ:-UTC}
    volumes:
      - dataprotection-keys:/source/volumes/dataprotection-keys:ro
      - assets:/source/volumes/assets:ro
      - documents:/source/volumes/documents:ro
      # Outside /source: only its hot copy enters the snapshot.
      - pocket-id:/pocket-id:ro
      - ./secrets:/source/deploy/secrets:ro
      - ./.env:/source/deploy/.env:ro
      # status.json for nid (read-only there). The volume is root's, 0755, and the backup is root: files it writes are 0644.
      - backup-state:/state
      # Never under /source: what opens the backup stays out of it. Neither folder is created by compose: it would
      # make them root's, and a missing backups folder would silently become a new, empty repository.
      - { type: bind, source: ./backup-secrets, target: /run/backup-secrets, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${NID_BACKUP_DIR:-./backups}", target: /repo, bind: { create_host_path: false } }
    tmpfs: ["/tmp:size=${NID_BACKUP_TMP_SIZE:-1g}"]
    networks: [data]
    healthcheck:
      test: [CMD, /usr/local/bin/nid-backup, status]
      interval: 5m
      timeout: 30s
      start_period: 2m
      start_interval: 5s
    depends_on: { postgres: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "1.0", memory: 512m } } }

  # Run by deploy/restore.sh only (profile restore): writes the volumes and deploy/ back with their owners.
  backup-restore:
    profiles: [restore]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    build: { context: ./backup }
    image: ${NID_BACKUP_IMAGE:-nid-backup:local}
    environment:
      NID_RESTORE_FROM: ${NID_RESTORE_FROM:-local}
      NID_HOST_UID: ${NID_HOST_UID:-0}
      NID_HOST_GID: ${NID_HOST_GID:-0}
      NID_DB_HOST: ${NID_DB_HOST:-}
    volumes:
      - dataprotection-keys:/target/volumes/dataprotection-keys
      - assets:/target/volumes/assets
      - documents:/target/volumes/documents
      - pocket-id:/target/volumes/pocket-id
      - ./:/target/deploy
      - { type: bind, source: ./backup-secrets, target: /run/backup-secrets, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${NID_BACKUP_DIR:-./backups}", target: /repo, bind: { create_host_path: false } }
    tmpfs: ["/tmp:size=${NID_BACKUP_TMP_SIZE:-1g}"]
    networks: [data]

# Only nid goes out to the Internet (security/infrastructure.md §2): every other network is internal. The hoster's
# proxy joins `edge` and keeps its own networks for the outside.
networks:
  edge: { internal: true }
  data: { internal: true }
  egress: {}

volumes:
  pgdata: {}
  pocket-id: {}
  dataprotection-keys: {}
  assets: {}
  documents: {}
  backup-state: {}

# Plain files (compose outside Swarm bind-mounts them): deploy/secrets/ is 0700, so only its owner and the daemon read them.
secrets:
  postgres_password: { file: ./secrets/postgres_password }
  nid_connection_string: { file: ./secrets/nid_connection_string }
  oidc_client_secret: { file: ./secrets/oidc_client_secret }
  csrf_key: { file: ./secrets/csrf_key }
  pocket_id_encryption_key: { file: ./secrets/pocket_id_encryption_key }
