# Development stack: PostgreSQL, Authelia and a TLS reverse proxy.
# Authelia only speaks HTTPS and refuses "localhost" as a cookie domain, so the stack answers on
# https://nid.localtest.me and https://auth.localtest.me (localtest.me resolves to 127.0.0.1).
# The application itself runs on the host (dotnet run) on port 5080; Caddy proxies to it.
name: nid-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nid
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  authelia:
    image: authelia/authelia:4.39
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
    volumes: ["./authelia:/config"]

  caddy:
    image: caddy:2
    ports: ["443:443"]
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      default:
        aliases: [auth.localtest.me, nid.localtest.me]

volumes:
  pgdata:
