# Authelia for Nid (1F1 design §4). deploy/setup.sh writes configuration.yml from this template.
# The session, storage, reset and HMAC secrets come from Docker secrets through AUTHELIA_*_FILE (deploy/compose.yaml).
server:
  address: 'tcp://:9091'
  # Authelia would write /app/.healthcheck.env for its image's healthcheck; the container is read-only, so the compose
  # checks /api/health itself instead.
  disable_healthcheck: true
log:
  level: info
authentication_backend:
  file:
    path: /config/users.yml
access_control:
  default_policy: one_factor
session:
  cookies:
    - domain: '@COOKIE_DOMAIN@'
      authelia_url: 'https://@AUTH_HOST@'
      default_redirection_url: 'https://@NID_HOST@'
storage:
  local:
    path: /var/lib/authelia/db.sqlite3
notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/run/secrets/authelia_jwks" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'nid'
        client_name: 'Nid'
        client_secret: '@CLIENT_SECRET_HASH@'
        public: false
        authorization_policy: 'one_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        consent_mode: 'implicit'
        redirect_uris: ['https://@NID_HOST@/auth/callback']
        scopes: ['openid', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        # ASP.NET Core sends the secret in the request body, not as HTTP Basic (docs/spikes.md section 8).
        token_endpoint_auth_method: 'client_secret_post'
