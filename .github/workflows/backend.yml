name: backend

# The solution: build, openapi.json, unit tests, integration tests. Called by ci.yml when a pull request touches it (ci.yml says
# why the filter lives there and not in a `paths:` here); `gh workflow run backend.yml` runs it alone.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every project, the test projects included, then the unit tests. Nid.Host regenerates web/src/api/openapi.json.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      integration: ${{ steps.projects.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build Nid.slnx --configuration Release
      - run: git diff --exit-code -- web/src/api/openapi.json
      - name: Unit tests
        run: |
          status=0
          for project in tests/*.Tests; do
            dotnet test --project "$project" --configuration Release --no-build || status=1
          done
          exit $status
      # The integration projects of the tree: a new one joins the matrix below without editing this file.
      - id: projects
        run: |
          projects=$(find tests -maxdepth 1 -type d -name '*.IntegrationTests' -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "integration=$projects" >> "$GITHUB_OUTPUT"

  # Testcontainers needs the runner's Docker. One job per project, in parallel: together they took about 25 minutes in a row.
  integration:
    needs: build
    if: needs.build.outputs.integration != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # every project's verdict, whatever the others did
      matrix:
        project: ${{ fromJSON(needs.build.outputs.integration) }}
    name: integration (${{ matrix.project }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # A run takes under 10 minutes; a test still running after 10 is stuck. The hang dump then stops the run, so the job fails
      # with the test's name instead of being cancelled by the timeout above with no log at all.
      - run: dotnet test --project "tests/${{ matrix.project }}" --configuration Release --hangdump --hangdump-timeout 10m --hangdump-type Mini
      - name: Hung tests
        if: failure()
        run: cat TestResults/*_hang.log 2>/dev/null || true
      # The dump of the stuck process (`dotnet-dump analyze`, then `clrstack -all`): test fixtures only, no household data.
      - name: Hang dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-dump-${{ matrix.project }}
          path: TestResults/*_hang.*
          retention-days: 7
          if-no-files-found: ignore
