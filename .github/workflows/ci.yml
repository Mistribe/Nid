name: ci

# The monthly Actions minutes are the budget (1000), so each commit is paid for once:
#  - a pull request builds the solution and checks the web app (`build`, `web`), each only when its files change (`changes`). It
#    runs no test: the developer runs them before opening it (.claude/CLAUDE.md). The integration tests also run weekly in e2e.yml;
#  - `main` runs only `images` (build the images, push them, tag the release), which a pull request does not: the pull request
#    already ran its checks on the tree being merged, and running them again on landing doubled the minutes for a verdict nobody
#    acted on. The smoke test and the backup test (`deploy/smoke.sh`, `deploy/backup-smoke.sh`) run on the developer's machine;
#  - a push that only touches docs runs nothing;
#  - the full Playwright journeys are e2e.yml, weekly.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# A second push supersedes the first (Auto-fix pushes often): a superseded run reports on a tree nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (security/infrastructure.md §5): only `images` writes to the repository (the release tag, below). Actions are
# pinned by SHA.
permissions:
  contents: read

jobs:
  # The jobs a pull request needs, from the files it changes: a job costs minutes (`web` about 12, `build` about 4), so a change to the
  # C# tests does not lint the web app, nor a change to the web app build the solution. `build` also follows openapi.json, which it
  # compares with the server's. Without a pull request (workflow_dispatch), both run.
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the changed files, read from the API: no checkout
    outputs:
      dotnet: ${{ steps.files.outputs.dotnet }}
      web: ${{ steps.files.outputs.web }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, .previous_filename // empty')
          if grep -qv '^web/' <<< "$files" || grep -qx 'web/src/api/openapi\.json' <<< "$files"; then dotnet=true; else dotnet=false; fi
          if grep -qE '^(web/|\.github/workflows/ci\.yml$)' <<< "$files"; then web=true; else web=false; fi
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Every project, the test projects included: they are compiled here, not run. Nid.Host regenerates web/src/api/openapi.json.
      - run: dotnet build Nid.slnx --configuration Release
      - run: git diff --exit-code -- web/src/api/openapi.json

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # schema.d.ts against the committed openapi.json; `build` compares that one with the server's.
      - run: pnpm --dir web check:api
      # `check` without vitest.
      - run: pnpm --dir web typecheck && pnpm --dir web lint && pnpm --dir web build && pnpm --dir web budget
        env:
          # Typed linting outgrows Node's default heap of about 2 GB.
          NODE_OPTIONS: --max-old-space-size=4096


  # Release: build the two images (nid, nid-backup), push them to the ACR (<sha>, latest, vX.Y.Z) and tag the release. No test, no scan, no smoke:
  # the pull request already ran its checks, and they cost too much CI time to run again on landing.
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the vX.Y.Z tag, pushed once the images are
      id-token: write # OIDC to Azure for the push below; the federated credential only trusts refs/heads/main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the action reads the whole history and the tags
      # Semver: the version one ahead of the latest vX.Y.Z tag (patch; `feat:` in a commit is a minor, `!:` or
      # `BREAKING CHANGE:` a major, see .claude/CLAUDE.md). It only computes it: the tag is pushed at the end, once the images are.
      - name: Next version
        id: semver
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          search_commit_body: true
      - name: Version
        env:
          NEXT: ${{ steps.semver.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then version=$NEXT; else version="$NEXT-ci.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"
      # The version list a click on the version shows: web/changelog/ dated by the tags (web/changelog/README.md).
      - name: Changelog
        run: node web/scripts/changelog.mjs "$VERSION" > web/public/changelog.json
      - name: Build images
        run: |
          docker build -f src/Nid.Host/Dockerfile --build-arg VERSION="$VERSION" -t nid:local .
          docker build -t nid-backup:local deploy/backup
      # The Azure login is the organisation's AZURE_* secrets and the federated credential of the « Github Actions » app for
      # repo:Mistribe/Nid:ref:refs/heads/main; the app is Contributor on the subscription, which includes AcrPush.
      - name: Log in to Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push the images to the ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          registry=oriondev.azurecr.io/mistribe
          az acr login --name oriondev
          for image in nid nid-backup; do
            for tag in "$GITHUB_SHA" latest "$VERSION"; do
              docker tag "$image:local" "$registry/$image:$tag"
              docker push "$registry/$image:$tag"
            done
          done
      - name: Tag the release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.semver.outputs.is_tagged != 'true'
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
