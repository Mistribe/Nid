name: ci

# The entry point of every check. The repository is public: standard GitHub-hosted runners (ubuntu-latest) cost nothing, so a
# pull request gets the full verdict here. Larger runners are paid: none is used.
#  - a pull request into `main` calls, in parallel, the workflows its files concern: backend.yml (build, openapi.json, unit and
#    integration tests), web.yml (API client, types, lint, vitest, build, budget), e2e.yml (every Playwright journey, images
#    scanned by Trivy); and reviews its new dependencies;
#  - `ci-ok` sums them up: it is the one check the `main` ruleset requires (with `changelog`);
#  - `main` runs only `images` (build the images, push them, tag the release): the pull request already ran its checks on the
#    tree being merged;
#  - every Monday, every check runs on `main` whatever changed: base images, the identity provider and the browsers move without
#    a push;
#  - a push or a pull request that only touches docs runs nothing.
#
# Why the area filter is a job here and not `paths:` in each workflow: a workflow skipped by `paths:` reports no status, so a
# required check would wait for it forever and block the merge. GitHub's advice is not to require a workflow that can be
# skipped (« Troubleshooting required status checks »). Here the workflow always runs; a call skipped by its `if:` reports
# `skipped`, which counts as a pass, and `ci-ok` always reports.
#
# Pull requests from forks: `pull_request` only, never `pull_request_target`, so their code runs with a read-only token and no
# secret. Only `images` holds secrets, and it never runs for a pull request.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# A second push supersedes the first (Auto-fix pushes often): a superseded run reports on a tree nobody has any more. The event is
# part of the group so the Monday run on main and a release never cancel each other. The called workflows have no group of their
# own: theirs would be this one's name and cancel this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (security/infrastructure.md §5): only `images` writes to the repository (the release tag, below). Actions are
# pinned by SHA.
permissions:
  contents: read

jobs:
  # What the pull request touches. Without a pull request (schedule, workflow_dispatch), everything runs.
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the changed files, read from the API
    outputs:
      backend: ${{ steps.files.outputs.backend }}
      web: ${{ steps.files.outputs.web }}
      e2e: ${{ steps.files.outputs.e2e }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            { echo "backend=true"; echo "web=true"; echo "e2e=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, .previous_filename // empty')
          # The solution: anything outside web/, and openapi.json, which its build compares with the server's.
          if grep -qv '^web/' <<< "$files" || grep -qx 'web/src/api/openapi\.json' <<< "$files"; then backend=true; else backend=false; fi
          if grep -qE '^(web/|\.github/workflows/(ci|web)\.yml$)' <<< "$files"; then web=true; else web=false; fi
          # The running app: the server, the web app, the compose and the build files.
          if grep -qE '^(src/|web/|deploy/|Directory\.(Build|Packages)\.props$|global\.json$|\.github/workflows/(ci|e2e)\.yml$)' <<< "$files"; then e2e=true; else e2e=false; fi
          { echo "backend=$backend"; echo "web=$web"; echo "e2e=$e2e"; } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  # A pull request that adds a dependency with a known high or critical vulnerability fails.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The required check: fails if any part failed or was cancelled; a skipped part is a pass.
  ci-ok:
    if: always() && github.event_name != 'push'
    needs: [changes, backend, web, e2e, dependencies]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  # Release: build the two images (nid, nid-backup), push them to the ACR (<sha>, latest, vX.Y.Z) and tag the release. No test:
  # the pull request already ran them on the tree being merged.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the vX.Y.Z tag, pushed once the images are
      id-token: write # OIDC to Azure for the push below; the federated credential only trusts refs/heads/main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the action reads the whole history and the tags
      # Semver: the version one ahead of the latest vX.Y.Z tag (patch; `feat:` in a commit is a minor, `!:` or
      # `BREAKING CHANGE:` a major, see .claude/CLAUDE.md). It only computes it: the tag is pushed at the end, once the images are.
      - name: Next version
        id: semver
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          search_commit_body: true
      - name: Version
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
      # The version list a click on the version shows: web/changelog/ dated by the tags (web/changelog/README.md).
      - name: Changelog
        run: node web/scripts/changelog.mjs "$VERSION" > web/public/changelog.json
      - name: Build images
        run: |
          docker build -f src/Nid.Host/Dockerfile --build-arg VERSION="$VERSION" -t nid:local .
          docker build -t nid-backup:local deploy/backup
      # The Azure login is the organisation's AZURE_* secrets and the federated credential of the « Github Actions » app for
      # repo:Mistribe/Nid:ref:refs/heads/main; the app is Contributor on the subscription, which includes AcrPush.
      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push the images to the ACR
        run: |
          registry=oriondev.azurecr.io/mistribe
          az acr login --name oriondev
          for image in nid nid-backup; do
            for tag in "$GITHUB_SHA" latest "$VERSION"; do
              docker tag "$image:local" "$registry/$image:$tag"
              docker push "$registry/$image:$tag"
            done
          done
      - name: Tag the release
        if: steps.semver.outputs.is_tagged != 'true'
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
