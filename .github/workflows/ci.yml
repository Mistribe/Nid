name: ci

# The monthly Actions minutes are the budget (1000), so each commit is paid for once:
#  - a pull request builds the solution and checks the web app (`build`, `web`), with no test at all: the .NET suite alone was
#    about 25 minutes. Tests run on the developer's machine (`dotnet test Nid.slnx`, `pnpm --dir web test`);
#  - `main` runs only `images` (build, scan, smoke, backup), which a pull request does not: the pull request already ran its
#    checks on the tree being merged, and running them again on landing doubled the minutes for a verdict nobody acted on.
#  - a push that only touches docs runs nothing;
#  - the full Playwright journeys are e2e.yml, weekly.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# A second push supersedes the first (Auto-fix pushes often): a superseded run reports on a tree nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (security/infrastructure.md §5): only `images` writes to the repository (the release tag, below). Actions are
# pinned by SHA.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Every project, the test projects included: they are compiled, not run.
      - run: dotnet build Nid.slnx --configuration Release

  web:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Regenerates web/src/api/openapi.json; check:api below fails if the committed copy differs.
      - run: dotnet build src/Nid.Host --configuration Release
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check:api
      # `pnpm check` minus its test step (vitest).
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - run: pnpm --dir web budget

  # 1F1: the images, their SBOM and scan, and the reference compose proven end to end. Only a short Playwright sample runs here
  # (NID_JOURNEYS=sample): the full journeys are e2e.yml, weekly or by hand, because they were most of the time of this job.
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the vX.Y.Z tag, pushed once the images are
      id-token: write # OIDC to Azure for the push below; the federated credential only trusts refs/heads/main
    env:
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the action reads the whole history and the tags
      # Semver: the version one ahead of the latest vX.Y.Z tag (patch; `feat:` in a commit is a minor, `!:` or
      # `BREAKING CHANGE:` a major, see .claude/CLAUDE.md). It only computes it: the tag is pushed at the end, once the images are.
      - name: Next version
        id: semver
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          search_commit_body: true
      - name: Version
        env:
          NEXT: ${{ steps.semver.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then version=$NEXT; else version="$NEXT-ci.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Build images
        run: |
          docker build -f src/Nid.Host/Dockerfile --build-arg VERSION="$VERSION" -t nid-api:local .
          docker build -f web/Dockerfile -t nid-web:local .
          docker build -t nid-backup:local deploy/backup
      - name: Unit tests of the backup image
        run: docker run --rm --entrypoint nid-backup-test nid-backup:local
      # The Docker socket is mounted into Trivy here only, to read the local images; never into the application
      # (security/infrastructure.md §1).
      # No artifact storage: the SBOM is what gets scanned, and its component list goes to the job summary. It is
      # rebuilt identically from the commit when needed.
      - name: SBOM (CycloneDX) and scan of the SBOM (fails on CRITICAL)
        run: |
          for image in nid-api nid-web nid-backup; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out "$TRIVY" \
              image --quiet --format cyclonedx --output "/out/sbom-$image.cdx.json" "$image:local"
            docker run --rm -v "$PWD":/out -v "$PWD/.trivyignore":/.trivyignore "$TRIVY" \
              sbom --quiet --severity CRITICAL --exit-code 1 --ignorefile /.trivyignore "/out/sbom-$image.cdx.json"
            {
              echo "<details><summary>$image: $(jq '.components | length' "sbom-$image.cdx.json") components</summary>"
              echo
              jq -r '.components[] | "- \(.name) \(.version // "")"' "sbom-$image.cdx.json" | sort -u
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Smoke test of the reference compose
        run: deploy/smoke.sh
        env:
          NID_JOURNEYS: sample
      - name: Backup and restore test
        run: deploy/backup-smoke.sh
      # The images tested above, pushed as they are (still in this runner's daemon), once everything else passed. The Azure
      # login is the organisation's AZURE_* secrets and the federated credential of the « Github Actions » app for
      # repo:Mistribe/Nid:ref:refs/heads/main; the app is Contributor on the subscription, which includes AcrPush.
      - name: Log in to Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push the images to the ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          registry=oriondev.azurecr.io/mistribe
          az acr login --name oriondev
          for image in nid-api nid-web nid-backup; do
            for tag in "$GITHUB_SHA" main "$VERSION"; do
              docker tag "$image:local" "$registry/$image:$tag"
              docker push "$registry/$image:$tag"
            done
          done
      - name: Tag the release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.semver.outputs.is_tagged != 'true'
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
      - name: Compose logs
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml -f deploy/local/compose.backup-test.yaml \
            logs --no-color --timestamps | tail -300
          docker compose -p nid-restore-test logs --no-color --timestamps | tail -100 || true
      # The page snapshot Playwright writes for a failed journey, printed rather than uploaded (no artifact storage);
      # the full trace comes from replaying the journey locally.
      - name: Playwright error context
        if: failure()
        run: |
          find web/test-results -name 'error-context.md' 2>/dev/null | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
