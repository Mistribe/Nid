name: web

# The web app: API client, types, lint, vitest, build, size budget. Called by ci.yml when a pull request touches web/ (ci.yml says
# why the filter lives there and not in a `paths:` here); `gh workflow run web.yml` runs it alone.
on:
  workflow_call:
    inputs:
      # ci.yml's `sonarqube`: vitest writes its coverage (lcov), uploaded as the `coverage-web` artifact.
      coverage:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # schema.d.ts against the committed openapi.json; the backend's build compares that one with the server's.
      - run: pnpm --dir web check:api
      # `pnpm check`: types, lint, vitest, build, budget.
      - run: pnpm --dir web check
        env:
          # Typed linting outgrows Node's default heap of about 2 GB.
          NODE_OPTIONS: --max-old-space-size=4096
          COVERAGE: ${{ inputs.coverage }}
      # A pull request: the initial bundle against the build of its base (main), so one pull request cannot grow it by more than
      # scripts/budget.mjs allows, however far it stays from the ceiling.
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          pnpm --dir "$RUNNER_TEMP/base/web" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/base/web" build
          pnpm --dir web budget --base "$RUNNER_TEMP/base/web/dist"
      # vitest writes the paths from web/; the scanner reads them from the repository root. Also after a failed test: the
      # analysis counts the coverage the others reported.
      - if: ${{ !cancelled() && inputs.coverage && hashFiles('web/coverage/lcov.info') != '' }}
        run: sed -i 's|^SF:|SF:web/|' web/coverage/lcov.info
      - if: ${{ !cancelled() && inputs.coverage && hashFiles('web/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 1
