name: sonarqube

# Code quality on SonarQube Cloud (project mistribe_nid): one analysis of the whole repository. SonarScanner for .NET wraps the
# build of the solution for C#, and also analyses the other files of the tree (TypeScript, CSS, YAML…) from the repository root.
# A pull request gets its own analysis, decorated on the pull request; a push to main updates the main branch's.
#
# The code coverage comes from every test: backend.yml runs the unit and integration tests with `coverage` (one artifact per
# project), `web` runs vitest with it; `analysis` downloads them all before the scanner's `end`. The tests run here a second time
# on a pull request (ci.yml runs them too): ci.yml never runs them on a push to main, and holds no secret.
#
# Not part of `ci-ok` (ci.yml), so not a required check: SonarQube Cloud's quality gate reports on the pull request by itself.
#
# The token (secret SONAR_TOKEN) never reaches a fork: `pull_request` only, never `pull_request_target`, and every job is skipped
# for a pull request opened from a fork, which gets no secret.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/backend.yml
    with:
      coverage: true

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test --coverage
      # vitest writes the paths from web/; the scanner reads them from the repository root.
      - if: ${{ !cancelled() }}
        run: sed -i 's|^SF:|SF:web/|' web/coverage/lcov.info
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 1

  # Runs even when a test failed: the analysis then counts the coverage the other tests reported.
  analysis:
    needs: [backend, web]
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame and new code: the analysis reads the whole history
          persist-credentials: false
      # The scanner's engine runs on Java.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 21
          distribution: zulu
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The analysers SonarQube Cloud downloads at each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # The .NET reports name the sources by their absolute path, the same on every runner (the workspace's).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      # dotnet-sonarscanner, pinned in .config/dotnet-tools.json (Renovate updates it).
      - run: dotnet tool restore
      # Excluded: what is generated (EF migrations, the OpenAPI document and the types made from it). Out of the coverage: the
      # scripts of deploy/ and the Playwright journeys, which no unit test runs.
      - name: Build and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner begin \
            /k:"mistribe_nid" /o:"mistribe" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="**/Migrations/**,web/src/api/openapi.json,web/src/api/schema.d.ts" \
            /d:sonar.coverage.exclusions="deploy/**,web/e2e/**" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage/*.coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="coverage/lcov.info"
          dotnet build Nid.slnx --configuration Release
          dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
