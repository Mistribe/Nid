name: zizmor

# Security audit of the workflows themselves (template injection, broad permissions, unpinned actions, cache poisoning):
# they publish the images and push the tags. Findings land in the Security tab and as annotations on the pull request.
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    branches: [main]
    paths: ['.github/**']
  schedule:
    - cron: '0 5 * * 1' # new audits find old workflows too
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # the results, uploaded to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: low
